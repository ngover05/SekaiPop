# Written by SekaiPop's install-deps-debian.sh. Nix programs on a distro other than NixOS
# look for these NixOS paths:
#   /run/opengl-driver   GPU drivers (Mesa) from the same nixpkgs as Hyprland and Quickshell
#   /run/wrappers/bin    setuid helpers. Nix's PAM (the lockscreen) checks the password with
#                        unix_chkpwd, Nix's polkit agent (the shell's prompts) runs
#                        polkit-agent-helper-1. Both point at the distro's own setuid copies.
L /run/opengl-driver - - - - /nix/var/nix/profiles/sekaipop-system
d /run/wrappers 0755 root root -
d /run/wrappers/bin 0755 root root -
L /run/wrappers/bin/unix_chkpwd - - - - @UNIX_CHKPWD@
L /run/wrappers/bin/polkit-agent-helper-1 - - - - @POLKIT_HELPER@
